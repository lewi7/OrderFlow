spring:
  application:
    name: orderflow-backend
  
  datasource:
    url: jdbc:postgresql://localhost:5432/orderflow
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  security:
    user:
      name: admin
      password: admin

# JWT Configuration
jwt:
  secret: your-secret-key-here-make-it-long-and-secure-in-production-this-needs-to-be-at-least-64-characters-long-for-hs512-algorithm
  expiration: 86400000 # 24 hours in milliseconds

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api

# Logging
logging:
  level:
    com.orderflow.backend: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Simulated Orders Configuration
orderflow:
  simulated-orders:
    enabled: true
    interval-minutes: 5
    sources:
      - UberEats
      - SkipTheDishes
      - DoorDash 